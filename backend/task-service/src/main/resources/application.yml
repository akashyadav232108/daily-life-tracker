server:
  port: 8082

spring:
  application:
    name: task-service

  # ── MySQL ──
  datasource:
    url: jdbc:mysql://localhost:3306/tracker_task_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# ── Kafka Producer ──
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# ── Caching (Caffeine — configured programmatically in CacheConfig.java) ──
spring.cache.type: caffeine

# ── JWT Configuration (shared secret — same as auth-service) ──
jwt:
  secret: ${JWT_SECRET:YTJkZmFzZGZhc2RmYXNkZjEyMzQ1Njc4OTAxMjM0NTY3ODkwYXNkZmFzZGY=}

# ── Logging ──
logging:
  level:
    com.tracker.task: DEBUG
    org.springframework.security: DEBUG
