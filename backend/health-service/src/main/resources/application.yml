server:
  port: 8083

spring:
  application:
    name: health-service

  # ── MySQL ──
  datasource:
    url: jdbc:mysql://localhost:3306/tracker_health_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ── Caching (Caffeine — configured programmatically in CacheConfig.java) ──
  cache:
    type: caffeine

  # ── Jackson: enable Java 8 date/time serialization ──
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

# ── JWT Configuration (shared secret — same as auth-service) ──
jwt:
  secret: ${JWT_SECRET:YTJkZmFzZGZhc2RmYXNkZjEyMzQ1Njc4OTAxMjM0NTY3ODkwYXNkZmFzZGY=}

# ── Logging ──
logging:
  level:
    com.tracker.health: DEBUG
    org.springframework.security: DEBUG
