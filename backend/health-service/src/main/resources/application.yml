server:
  port: 8083

spring:
  application:
    name: health-service

  # ── MySQL ──
  datasource:
    url: jdbc:mysql://localhost:3306/tracker_health_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ── Kafka Producer ──
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  # ── Caching (Caffeine — configured programmatically in CacheConfig.java) ──
  cache:
    type: caffeine

  # ── Redis (for rate limiting) ──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # ── Jackson: enable Java 8 date/time serialization ──
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

# ── JWT Configuration (shared secret — same as auth-service) ──
jwt:
  secret: ${JWT_SECRET}

# ── Rate Limiting (Bucket4j + Redis) ──
rate-limit:
  global:
    tokens: 200
    refill-minutes: 1
    refill-hours: 0
  summary-queries:         # GET /health/summary/weekly
    tokens: 20
    refill-minutes: 1
    refill-hours: 0

# ── Logging ──
logging:
  level:
    com.tracker.health: DEBUG
    org.springframework.security: DEBUG
