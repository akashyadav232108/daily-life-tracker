server:
  port: ${PORT}
  address: 0.0.0.0

spring:
  application:
    name: auth-service

# -- MySQl ---
  #datasource:
    #url: ${DB_URL}
    #username: ${DB_USERNAME}
    #password: ${DB_PASSWORD}
    #driver-class-name: com.mysql.cj.jdbc.Driver

#-- PostgreSQL --

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect ✅


  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  # ✅ FIXED REDIS (IMPORTANT)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: true
      timeout: 2000ms

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SENDER_MAIL}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  thymeleaf:
    check-template-location: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

app:
  email:
    from: ${SENDER_MAIL}
    from-name: ${APP_NAME}

otp:
  expiry-minutes: 10
  reset-token-expiry-minutes: 5

rate-limit:
  global:
    tokens: 200
    refill-minutes: 1
    refill-hours: 0
  auth-sensitive:
    tokens: 5
    refill-minutes: 1
    refill-hours: 0
  otp-flow:
    tokens: 3
    refill-minutes: 10
    refill-hours: 0
  password-ops:
    tokens: 5
    refill-minutes: 10
    refill-hours: 0
  account-delete:
    tokens: 3
    refill-minutes: 0
    refill-hours: 1

logging:
  level:
    com.tracker.auth: INFO
    org.springframework.security: WARN
