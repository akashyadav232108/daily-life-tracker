server:
  port: 8085

spring:
  application:
    name: notification-service

  # ── MySQL ──
  datasource:
    url: jdbc:mysql://localhost:3306/tracker_notification_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ── Redis (unread count cache + streak cache + today's workout cache) ──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # ── Kafka (consumer only — listens to task-events, health-events, expense-events) ──
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false

  # ── Email (Gmail SMTP) ──
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:your-email@gmail.com}
    password: ${GMAIL_APP_PASSWORD:your-app-password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 5000

  # ── Thymeleaf (for email templates only — disable web templates) ──
  thymeleaf:
    check-template-location: false

  # ── Jackson: Java 8 date/time serialization ──
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

# ── JWT Configuration (shared secret — same as auth-service) ──
jwt:
  secret: ${JWT_SECRET:YTJkZmFzZGZhc2RmYXNkZjEyMzQ1Njc4OTAxMjM0NTY3ODkwYXNkZmFzZGY=}

# ── Kafka topics being consumed ──
kafka:
  topic:
    task-events: task-events
    health-events: health-events
    expense-events: expense-events

# ── Email config ──
app:
  email:
    from: ${GMAIL_USERNAME:your-email@gmail.com}
    from-name: Daily Life Tracker

# ── Logging ──
logging:
  level:
    com.tracker.notification: DEBUG
    org.springframework.security: DEBUG
    org.springframework.kafka: WARN
    org.springframework.mail: DEBUG
