server:
  port: 8081

spring:
  application:
    name: auth-service

  # ── MySQL ──
  datasource:
    url: jdbc:mysql://localhost:3306/tracker_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ── Kafka Producer ──
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  # ── Redis (for JWT blacklisting & refresh tokens) ──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# ── JWT Configuration ──
jwt:
  secret: ${JWT_SECRET:YTJkZmFzZGZhc2RmYXNkZjEyMzQ1Njc4OTAxMjM0NTY3ODkwYXNkZmFzZGY=}
  access-token-expiration: 900000       # 15 minutes (in milliseconds)
  refresh-token-expiration: 604800000   # 7 days (in milliseconds)

# ── Logging ──
logging:
  level:
    com.tracker.auth: DEBUG
    org.springframework.security: DEBUG
